name: Validate bug report version

on:
  issues:
    types: [opened, edited]

concurrency:
  group: bug-report-version-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate app version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const issue = context.payload.issue;
            // Accept the rebranded "MCC version" / neutral "App version" header,
            // and the legacy "FCC version" header for pre-rebrand issues.
            const fieldPattern = "^### (?:FCC|MCC|App) version\r?\n+\s*([^\r\n]+)";
            // Accept a bare semver, or one prefixed with the old or new package name.
            const versionPattern = "^(?:(?:(?:free-claude-code|my-claude-code) )?\d+\.\d+\.\d+|None)$";
            const match = (issue.body || "").match(new RegExp(fieldPattern, "m"));
            const version = match?.[1]?.trim() || "";
            const valid = new RegExp(versionPattern).test(version);
            const labelName = "needs-fcc-version";
            const marker = "<!-- fcc-version-validator -->";
            const labels = new Set(issue.labels.map((label) => label.name));
            const repo = context.repo;
            const issue_number = issue.number;

            if (valid) {
              if (labels.has(labelName)) {
                await github.rest.issues.removeLabel({
                  ...repo,
                  issue_number,
                  name: labelName,
                });
              }
              return;
            }

            if (!labels.has(labelName)) {
              try {
                await github.rest.issues.getLabel({ ...repo, name: labelName });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    ...repo,
                    name: labelName,
                    color: "d4c5f9",
                    description: "App version must be number.number.number or None",
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
              await github.rest.issues.addLabels({
                ...repo,
                issue_number,
                labels: [labelName],
              });
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...repo, issue_number, per_page: 100 },
            );
            if (!comments.some((comment) => comment.body?.includes(marker))) {
              await github.rest.issues.createComment({
                ...repo,
                issue_number,
                body: `${marker}\nPlease edit **App version** to contain only an exact `number.number.number` value, such as `5.0.0`, or `None`. Run `mcc-server --version` to find the installed version.`,
              });
            }
